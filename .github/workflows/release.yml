name: release

# 실행 파일 자동 배포.
#   - v* 태그를 밀면  → 그 태그로 정식 릴리스
#   - main 에 push    → 'nightly' 선릴리스를 덮어쓴다 (항상 최신이 한 주소에)
#   - 수동 실행       → 태그 이름을 직접 줘서 다시 올린다
#
# 어느 경로든 '실제로 떠서 화면을 주는지' 를 통과한 것만 올라간다.
# 안 뜨는 실행 파일을 올리면 교실에서야 알게 된다.

on:
  push:
    tags: ["v*"]
    branches: ["main"]
  workflow_dispatch:
    inputs:
      tag:
        description: "릴리스 태그 (비우면 nightly)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: pibo-connector-windows.exe
            built: dist/pibo-connector.exe
          - os: ubuntu-latest
            asset: pibo-connector-linux
            built: dist/pibo-connector
          - os: macos-latest
            asset: pibo-connector-macos
            built: dist/pibo-connector
    runs-on: ${{ matrix.os }}
    env:
      # step 의 if 는 secrets 를 직접 못 보고, 자기 step 의 env 도 못 본다.
      # job env 로 올려야 아래 '코드 서명' 단계의 if 가 실제로 평가된다.
      HAS_CERT: ${{ secrets.WIN_CERT_PFX_B64 != '' && secrets.WIN_CERT_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 태그와 __version__ 이 같은지 (정식 릴리스만)
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          # 앱은 자기 버전을 pibo_connector.__version__ 에서 읽는다. 태그와 다르면
          # 화면·/api/info 가 엉뚱한 버전을 말한다. v0.1.0 때 실제로 그랬다.
          v="v$(python -c 'import pibo_connector; print(pibo_connector.__version__)')"
          if [ "$v" != "${{ github.ref_name }}" ]; then
            echo "!! 태그 ${{ github.ref_name }} 과 __version__ $v 이 다르다."
            echo "   pibo_connector/__init__.py 와 pyproject.toml 을 올려 main 에 넣은 뒤 다시 태그할 것"
            exit 1
          fi
          echo "ok $v"
      - name: 의존성
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: 빌드
        run: pyinstaller build/pibo-connector.spec --noconfirm
      - name: 실제로 뜨는지 (이걸 통과해야 올린다)
        run: python -m tests.exe_smoke ${{ matrix.built }} --timeout 150

      # ── 윈도우 코드 서명 (인증서 secret 이 있을 때만) ──
      # 서명이 없으면 Windows 가 파일 해시 평판으로 SmartScreen 경고를 띄우고,
      # Windows 11 스마트 앱 컨트롤은 아예 실행을 막는다. 빌드마다 해시가 바뀌어
      # 평판도 매번 0 부터다. 서명하면 둘 다 풀린다.
      #   WIN_CERT_PFX_B64  : 코드 서명 인증서(.pfx) 를 base64 로 (certutil -encode / base64 -w0)
      #   WIN_CERT_PASSWORD : 그 pfx 비밀번호
      # 둘 다 없으면 이 단계는 건너뛴다 — 지금처럼 서명 없이 올라간다.
      - name: 코드 서명 (인증서가 있을 때만)
        if: runner.os == 'Windows' && env.HAS_CERT == 'true'
        env:
          PFX_B64: ${{ secrets.WIN_CERT_PFX_B64 }}
          PFX_PASS: ${{ secrets.WIN_CERT_PASSWORD }}
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_B64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
                      Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          & $signtool sign /f $pfx /p $env:PFX_PASS /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
                     /d "pibo-connector" "${{ matrix.built }}"
          if ($LASTEXITCODE -ne 0) { throw "서명 실패" }
          & $signtool verify /pa /v "${{ matrix.built }}"
          if ($LASTEXITCODE -ne 0) { throw "서명 검증 실패" }
          Remove-Item $pfx -Force
      - name: 이름 붙이기
        shell: bash
        run: |
          mkdir -p out
          cp "${{ matrix.built }}" "out/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: 한곳에 모으기
        run: |
          mkdir -p out
          find art -type f -exec cp {} out/ \;
          ls -la out
      - name: 태그 정하기
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "pre=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "pre=false" >> "$GITHUB_OUTPUT"
          else
            echo "name=nightly" >> "$GITHUB_OUTPUT"
            echo "pre=true" >> "$GITHUB_OUTPUT"
          fi
      - name: nightly 는 매번 덮어쓴다
        if: steps.tag.outputs.name == 'nightly'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete nightly --cleanup-tag --yes || true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          prerelease: ${{ steps.tag.outputs.pre }}
          generate_release_notes: ${{ steps.tag.outputs.pre == 'false' }}
          body: |
            ## 파이보 커넥터 ${{ steps.tag.outputs.name }}

            교실의 파이보·파이브레인을 브라우저 한 장으로 찾고, 같은 코드를 한 번에 실행해요.
            노트북에 아무것도 설치하지 않아요. 아래 파일 하나만 받으면 돼요.

            ### 1. 받기

            | 노트북 | 아래 **Assets** 에서 받을 파일 |
            |---|---|
            | **Windows** | `pibo-connector-windows.exe` |
            | macOS | `pibo-connector-macos` — 터미널에서 `chmod +x` 한 뒤, 첫 실행은 우클릭 → 열기 |
            | Linux | `pibo-connector-linux` — `chmod +x` 한 뒤 실행 |

            ### 2. 실행하기

            1. 받은 파일을 더블클릭해요.
            2. **"Windows의 PC 보호"** 창이 뜨면 → **추가 정보** → **실행**. 그 PC 에서는 한 번이면 돼요.
            3. 검은 창이 하나 뜨고, 잠시 뒤 브라우저가 열려요. **검은 창은 닫지 마세요** — 닫으면 꺼져요.
            4. 로봇과 노트북이 **같은 와이파이**에 있는지 확인하고 [로봇 찾기] 를 누르세요.

            ### 잘 안 될 때

            - **로봇이 안 찾아져요** → 로봇이 켜져 있고 노트북과 같은 와이파이인지 봐요. 5초쯤 기다렸다 한 번 더 눌러요.
            - **브라우저가 안 열려요** → 검은 창에 적힌 주소(보통 `http://127.0.0.1:8900/`)를 브라우저에 직접 넣어요.
            - **와이파이에 못 붙은 로봇이 있어요** → [와이파이 못 붙은 로봇] 을 누르면 누가 못 붙었는지 번호가 나와요.

            <details><summary>개발자용</summary>

            소스로 돌리려면 `pip install -r requirements.txt && python run.py`.
            세 파일 모두 CI 에서 실제로 띄워 화면·폰트·이미지까지 나오는 것을 확인한 빌드예요.
            커밋 `${{ github.sha }}`
            </details>
          files: out/*
